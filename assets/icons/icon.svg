  </g>
  <!-- Texto Inferior -->
  <text x="256" y="435" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="4">MERCADO DA CARNE</text>
  <text x="256" y="465" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#FBBF24" letter-spacing="6">SANTO ANDRÉ</text>
